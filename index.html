<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Screen Website Viewer</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        button {
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <button onclick="loadWebsite()">Display Website</button>

    <iframe id="siteFrame"></iframe>

    <script>
        function loadWebsite() {
            document.getElementById("siteFrame").src = "https://bloxd.io";
        }
    </script>

</body>
</html>
