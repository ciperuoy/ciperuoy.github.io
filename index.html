<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ci's school tips</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
            background: #ff9800;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #ffa726;
            }

        iframe {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
        }
    </style>
</head>
<body>

    <button onclick="reloadBloxd()">BLOXD.IO</button>

    <iframe id="bloxdFrame"
            src="https://bloxd.io">
    </iframe>

    <script>
        function reloadBloxd() {
            const iframe = document.getElementById("bloxdFrame");
            iframe.src = iframe.src;
        }
    </script>

</body>
</html>

</body>
</html>
