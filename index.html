<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ci's school tips</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }

        /* TITLE - 0.5 seconds */
        h1 {
            font-size: 3em;
            opacity: 0;
            transform: translateY(-20px);
            animation: slideFade 0.5s ease-out forwards;
        }

        @keyframes slideFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* DESCRIPTION - starts at 0.5s, ends at 0.8s */
        p {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
            animation-delay: 0.5s;
        }

        /* BUTTONS - start at 0.8s, finish at 1s */
        .buttons {
            margin-top: 30px;
            opacity: 0;
            animation: fadeIn 0.2s ease forwards;
            animation-delay: 0.8s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Buttons style */
        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: white;
            color: #2a5298;
            transition: 0.3s;
        }

            button:hover {
                background-color: #ffd700;
                color: black;
                transform: scale(1.1);
            }
    </style>
</head>

<body>

    <h1>ciperuoy's school tips</h1>
    <p>THIS WHOLE WEBSITE IS CREATED BY CHATGPT!!</p>

    <div class="buttons">
        <button onclick="goToWebsite('https://www.ixl.com'">IXL</button>
        <button onclick="goToWebsite('https://www.amplify.com'">Amplify</button>
        <button onclick="goToSubdomain('games')">External</button>
    </div>

    <script>
        function goToSubdomain(sub) {
            window.location.href = "https://ciperuoy.github.io/" + sub;
        }
    </script>

    <script>
        function goToWebsite(url) {
            window.location.href = url;
    </script>

</body>
</html>
