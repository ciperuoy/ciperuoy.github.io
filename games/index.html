<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ci's school tips</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg, red, orange);
            background-size: 400% 400%;
            animation: fireFade 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        @keyframes fireFade {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            color: white;
            margin-bottom: 10px;
        }

        #searchBar {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .scroll-container {
            width: 100%;
            max-width: 320px;
            height: 400px;
            overflow-y: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            padding: 10px;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin-bottom: 8px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #4CAF50, #2E8B57);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            }

        .crossed-text {
            position: relative;
            opacity: 0.6;
        }

            .crossed-text::after {
                content: "";
                position: absolute;
                left: 0;
                top: 50%;
                width: 100%;
                height: 2px;
                background: red;
                transform: translateY(-50%);
            }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 30px 35px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .name-link {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

            .name-link:hover {
                color: cyan;
                text-shadow: 0 0 8px cyan;
            }
    </style>
</head>

<body>
    <div class="card">
        <h1>
            <a href="https://guns.lol/ciperuoy" target="_blank" class="name-link">ciperuoy</a>'s school
            <span class="crossed-text">tips</span>
            games
        </h1>

        <input type="text" id="searchBar" placeholder="Search games...">

        <div class="scroll-container">
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/bloxd')">Bloxd.io</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/tetris')">Tetris</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/slither')">Slither.io</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/zombs')">Zombs.io</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/amongus')">Among Us</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/smallwc')">Small World Cup</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/driftboss')">Drift Boss</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/bitlife')">BitLife</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/e1.8.8')">EaglerCraft 1.8.8</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/deathrun3d')">Death Run 3D</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/slope')">Slope</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/gdash')">Geometry Dash</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/gdsubzero')">GD Subzero</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/totm')">Tomb of The Mask</button>
            <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/fnaf1')">FNAF 1</button>
        </div>
    </div>

    <script>
        function goTo(url) {
            window.open(url, "_blank");
        }

        const searchBar = document.getElementById("searchBar");
        const container = document.querySelector(".scroll-container");

        function sortButtons() {
            const buttons = Array.from(container.querySelectorAll(".btn"));

            buttons.sort((a, b) => {
                return a.textContent.localeCompare(b.textContent);
            });

            buttons.forEach(button => container.appendChild(button));
        }

        sortButtons();

        const buttons = document.querySelectorAll(".btn");

        searchBar.addEventListener("keyup", function () {
            const filter = searchBar.value.toLowerCase();

            buttons.forEach(button => {
                const text = button.textContent.toLowerCase();
                if (text.includes(filter)) {
                    button.style.display = "block";
                } else {
                    button.style.display = "none";
                }
            });
        });
    </script>

</body>
</html>
