<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ci's school tips</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #searchBar {
            width: 300px;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .scroll-container {
            width: 320px;
            height: 400px;
            overflow-y: scroll;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
            padding: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #4CAF50, #2E8B57);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            }
    </style>
</head>

<body>

    <h1>ci's school GAMES</h1>

    <input type="text" id="searchBar" placeholder="Search websites...">

    <div class="scroll-container">
        <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/bloxd')">BLOXD.IO</button>
        <button class="btn" onclick="goTo('https://ciperuoy.github.io/games/tetris')">Tetris (unfunctional)</button>
        <button class="btn" onclick="goTo('https://example.com')">Placeholder</button>
    </div>

    <script>
        function goTo(url) {
            window.open(url, "_blank");
        }

        const searchBar = document.getElementById("searchBar");
        const buttons = document.querySelectorAll(".btn");

        searchBar.addEventListener("keyup", function () {
            const filter = searchBar.value.toLowerCase();

            buttons.forEach(button => {
                const text = button.textContent.toLowerCase();
                if (text.includes(filter)) {
                    button.style.display = "block";
                } else {
                    button.style.display = "none";
                }
            });
        });
    </script>

</body>
</html>
