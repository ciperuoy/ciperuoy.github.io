<!DOCTYPE html>
<html>
<head>
    <title>Account Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .loginBox {
            width: 400px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 22px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7);
        }

            .loginBox h2 {
                margin: 0 0 35px 0;
                font-weight: normal;
                letter-spacing: 1px;
            }

        input, button {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            margin-bottom: 18px;
        }

        input {
            background: #2a2a2a;
            color: white;
            padding: 0 15px;
            outline: none;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

            input::placeholder {
                color: #aaa;
            }

            input:focus {
                background: #333;
                box-shadow: 0 0 10px rgba(51,153,255,0.4);
            }

        button {
            background: #2a2a2a;
            color: white;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

            button:hover {
                background: #444;
                box-shadow: 0 0 15px rgba(51,153,255,0.3);
            }

            button:active {
                transform: scale(0.97);
            }

        .secondaryBtn {
            background: transparent;
            border: 1px solid #333;
        }

            .secondaryBtn:hover {
                background: #222;
            }

        .errorText {
            color: #ff5c5c;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .showPasswordRow {
            display: flex;
            justify-content: center;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .checkboxContainer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
        }

            .checkboxContainer input {
                display: none;
            }

        .customCheck {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #555;
            position: relative;
            transition: background 0.2s ease;
        }

            .customCheck::after {
                content: "";
                position: absolute;
                left: 4px;
                top: 1px;
                width: 5px;
                height: 9px;
                border: solid white;
                border-width: 0 2px 2px 0;
                transform: rotate(45deg);
                opacity: 0;
                transition: opacity 0.2s ease;
            }

        .checkboxContainer input:checked + .customCheck {
            background: #3399ff;
        }

            .checkboxContainer input:checked + .customCheck::after {
                opacity: 1;
            }
    </style>
</head>
<body>

    <div class="loginBox">
        <h2>Account Login</h2>

        <div id="error" class="errorText"></div>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <div class="showPasswordRow">
            <label class="checkboxContainer">
                <input type="checkbox" id="showPassword">
                <span class="customCheck"></span>
                Show Password
            </label>
        </div>

        <button id="loginBtn">Login</button>
        <button class="secondaryBtn" id="signupBtn">Sign Up</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKI1U5LWbj78cfIBTBUhLZWn2F_-pGp28",
            authDomain: "ciwager.firebaseapp.com",
            projectId: "ciwager",
            appId: "1:385173892825:web:7dceb247867d0b3350d8c8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const appDomain = "ciperuoy.app";

        function convertUsername(username) {
            return username.toLowerCase() + "@" + appDomain;
        }

        function showError(message) {
            const errorBox = document.getElementById("error");
            errorBox.innerText = message;
            errorBox.style.display = "block";
        }

        /* =========================
           PASSWORD TOGGLE (FIXED)
        ========================= */
        const passwordInput = document.getElementById("password");
        const showPasswordCheckbox = document.getElementById("showPassword");

        showPasswordCheckbox.addEventListener("change", () => {
            passwordInput.type = showPasswordCheckbox.checked ? "text" : "password";
        });

        /* =========================
           LOGIN
        ========================= */
        document.getElementById("loginBtn").onclick = async () => {
            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showError("Please fill in all fields.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, convertUsername(username), password);
                window.location.href = "index.html";
            } catch (err) {
                if (err.code === "auth/user-not-found") {
                    showError("Account does not exist.");
                } else if (err.code === "auth/wrong-password") {
                    showError("Incorrect password.");
                } else if (err.code === "auth/too-many-requests") {
                    showError("Too many failed attempts. Try again later.");
                } else {
                    showError("Login failed.");
                    console.log(err);
                }
            }
        };

        /* =========================
           SIGNUP
        ========================= */
        document.getElementById("signupBtn").onclick = async () => {
            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value.trim();

            if (username.length < 3) {
                showError("Username must be at least 3 characters.");
                return;
            }

            if (password.length < 6) {
                showError("Password must be at least 6 characters.");
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, convertUsername(username), password);
                window.location.href = "index.html";
            } catch (err) {
                if (err.code === "auth/email-already-in-use") {
                    showError("Username already taken.");
                } else if (err.code === "auth/weak-password") {
                    showError("Password is too weak.");
                } else {
                    showError("Signup failed.");
                    console.log(err);
                }
            }
        };

        /* =========================
           AUTO REDIRECT IF LOGGED IN
        ========================= */
        onAuthStateChanged(auth, user => {
            if (user) {
                window.location.href = "index.html";
            }
        });
    </script>

</body>
</html>
