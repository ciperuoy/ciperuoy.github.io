<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <script src="https://cdn.jsdelivr.net/gh/marcrobledo/RomPatcher.js/build/RomPatcher.min.js"></script>

    <script>
        window.addEventListener("load", async () => {
            try {
                const romResponse = await fetch("Tetris (USA).nes");
                if (!romResponse.ok) return;

                const patchResponse = await fetch("TetrisGYM-6.0.0.bps");
                if (!patchResponse.ok) return;

                const romArray = new Uint8Array(await romResponse.arrayBuffer());
                const patchArray = new Uint8Array(await patchResponse.arrayBuffer());

                const patchedRom = RomPatcher.applyPatch(romArray, patchArray);

                const blob = new Blob([patchedRom], { type: "application/octet-stream" });
                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;
                a.download = "TetrisGYM-6.0.0.nes";
                document.body.appendChild(a);
                a.click();
                a.remove();

            } catch (e) {
                console.error(e);
            }
        });
    </script>

</body>
</html>
